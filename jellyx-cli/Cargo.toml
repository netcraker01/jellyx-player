[package]
name = "jellyx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI for Jellyx — full-parity Ratatui frontend."

[[bin]]
name = "jellyx-cli"
path = "src/main.rs"

[dependencies]
jellyx-core = { path = "../jellyx-core" }
jellyx-engine = { path = "../jellyx-engine" }
ratatui = "0.30"
crossterm = "0.29"
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = "0.15"
symphonia = { version = "0.6", features = ["mp3", "isomp4", "aac", "ogg", "vorbis", "flac", "wav", "pcm"] }
symphonia-core = "0.6"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "charset"] }
which = "7"
